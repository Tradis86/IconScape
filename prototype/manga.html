<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconScape · 漫画</title>
<!--
  IconScape · manga theme (black-and-white comic page; Canvas 2D)
  Art direction: the desktop is one page of a manga. Every group of icons sits on a solid black ink splash (beta) with a sea-urchin burst
  of impact spikes around it; the rest of the page is divided into panels with screentone, speed lines, focus lines, hatching,
  a night city, clouds and hollow sound effects
  - Ink: the same icon field as the other themes (a sum of Gaussians around the icons, warped by noise); outline traced with marching squares
  - Static drawing (paper and panels; ink, halo and spikes per icon layout) is cached at the screen's actual pixels; when the icons move
    the old and the new ink cross-fade
  - Every frame only draws small things: sparkles on the ink, falling cherry petals, sound effects popping up and, now and then, a crow
  - The page, the ink, the petals, the sound effects and the crow live in desktop coordinates, so they continue across monitors
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f2e9; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* Preview mode (?preview=1, inside the settings window) and standalone mode: translucent blocks mark where the icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.ghosts #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(0,0,0,.35); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="ghosts"></div>
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;   // desktop grid (also used by share.js)
const STEP = 6;                                  // field grid (CSS px)
const MARGIN = 220;                              // the field reaches this far beyond the desktop, so outlines close off-screen
const MORPH_MS = 1600;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');                // wallpaper mode: loaded by the desktop host; messages come from the host
const PREVIEW = QS.has('preview');               // preview mode: the preview (iframe) in the settings window; messages come from the parent page
// The whole desktop (CSS px): the scene is computed over all monitors in these coordinates and this page draws only its own monitor,
// which sits at (WORLD.x, WORLD.y); mons: the monitors' rectangles. Without a layout from the host the desktop is this screen alone
let WORLD = { x: 0, y: 0, w: innerWidth, h: innerHeight, mons: [[0, 0, innerWidth, innerHeight]], set: false };
function applyDesktop(m) {
  const k = window.devicePixelRatio || 1;          // physical pixels → CSS pixels
  WORLD = { x: m.x / k, y: m.y / k, w: m.w / k, h: m.h / k, mons: (m.mons || []).map(r => r.map(v => v / k)), set: true };
  if (!WORLD.mons.length) WORLD.mons = [[WORLD.x, WORLD.y, innerWidth, innerHeight]];
}
const wallClock = () => Date.now() / 1000;       // shared by the pages of all monitors: things that cross from one monitor to another stay in step
// Defaults must match the "default" values of the manga theme in themes.json
const P = { sigma: 70, warp: 30, burst: 0.6, palette: 0, panels: 0.5, sfx: 0.5, petals: 20, flow: 1, crow: 1, adaptive: 1, cap30: true };
const DEFAULTS = Object.assign({}, P);
// Accepted parameters: [min, max, integer]
const RANGES = { sigma: [40, 200], warp: [0, 80], burst: [0, 1], palette: [0, 3, 1], panels: [0, 1], sfx: [0, 1],
  petals: [0, 60, 1], flow: [0, 3], crow: [0, 1, 1], adaptive: [0, 1, 1] };
// Ink and paper: classic black and white, sepia, blue ink, shoujo pink. tone: the screentone dots; petal: fill of the cherry petals
const PALS = [
  { paper: '#f6f2e9', ink: '#121212', tone: '#1a1a1a', petal: '#ffffff' },
  { paper: '#eee0c2', ink: '#36200f', tone: '#4f321b', petal: '#fbf2e0' },
  { paper: '#edf2f8', ink: '#111f45', tone: '#1c3570', petal: '#ffffff' },
  { paper: '#fff0f4', ink: '#2a1020', tone: '#d47496', petal: '#ffc2d6' },
];
const GEOMETRY_KEYS = ['sigma', 'warp', 'burst', 'adaptive'];
// Japanese sans fonts shipped with Windows; the sound effects are katakana in every interface language, as in a real manga
const JFONT = '"Yu Gothic UI", "Yu Gothic", "Meiryo", "MS Gothic", sans-serif';
const WORDS = ['ドン!', 'ゴゴゴ', 'バーン', 'ザワ…', 'ドキドキ', 'シーン', 'キラッ', 'ズドーン', 'ワクワク', 'ガーン!', 'ドドド'];
const SHAKY = new Set(['ゴゴゴ', 'ドドド', 'ザワ…', 'ドキドキ']);   // these tremble while they are shown
const IMPACT = new Set(['ドン!', 'バーン', 'ズドーン', 'ガーン!']);   // these get a burst of short lines behind them

/* ======================================================================
   Random numbers and noise (seeded: desktop and preview show the same scene)
   ====================================================================== */
let seed = WALL || PREVIEW ? 7919 : (Math.random() * 1e6) | 0;   // hosted: the same default on every monitor until the settings give one
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ss = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const mod = (a, n) => ((a % n) + n) % n;

/* ======================================================================
   Ink field (CPU): s = signed distance to the ink's outline (<0 is ink), as in the other themes
   Desktop coordinates; grid point (gx, gy) is at (gx * STEP - MARGIN, gy * STEP - MARGIN)
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;   // W, H: this screen (share.js uses them too)
function buildNoise() {
  Gw = Math.ceil((WORLD.w + 2 * MARGIN) / STEP) + 2; Gh = Math.ceil((WORLD.h + 2 * MARGIN) / STEP) + 2;
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP - MARGIN, y = gy * STEP - MARGIN;
    NZ.wx[i] = fbm(x * 0.0032, y * 0.0032, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0032, y * 0.0032, 2) - 0.47;
  }
}
// rects: { cx, cy, hw, hh, w } (w: weight)
function computeField(rects) {
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig), wa = P.warp * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx + MARGIN - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + MARGIN + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy + MARGIN - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + MARGIN + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5, w = r.w || 1;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP - MARGIN + NZ.wx[i] * wa, qy = gy * STEP - MARGIN + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += w * Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  return s;
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max((x + MARGIN) / STEP, 0), Gw - 1.001), fy = Math.min(Math.max((y + MARGIN) / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

// Marching squares at level lv; the grid is padded with "paper" so every outline is a closed loop. Returns loops of [x0, y0, x1, y1, …] (CSS px)
function contours(s, lv) {
  const gw = Gw + 2, gh = Gh + 2, V = new Float32Array(gw * gh);
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++)
    V[j * gw + i] = i < 1 || j < 1 || i > Gw || j > Gh ? 1e3 : s[(j - 1) * Gw + i - 1] - lv;
  const pos = new Map(), adj = new Map();
  const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
  const hk = (i, j) => {                          // point on the edge (i, j)–(i+1, j)
    const k = (j * gw + i) * 2;
    if (!pos.has(k)) { const a = V[j * gw + i], b = V[j * gw + i + 1]; pos.set(k, [(i - 1 + a / (a - b)) * STEP - MARGIN, (j - 1) * STEP - MARGIN]); }
    return k;
  };
  const vk = (i, j) => {                          // point on the edge (i, j)–(i, j+1)
    const k = (j * gw + i) * 2 + 1;
    if (!pos.has(k)) { const a = V[j * gw + i], b = V[(j + 1) * gw + i]; pos.set(k, [(i - 1) * STEP - MARGIN, (j - 1 + a / (a - b)) * STEP - MARGIN]); }
    return k;
  };
  for (let j = 0; j < gh - 1; j++) for (let i = 0; i < gw - 1; i++) {
    const a = V[j * gw + i], b = V[j * gw + i + 1], c = V[(j + 1) * gw + i + 1], d = V[(j + 1) * gw + i];
    const code = (a < 0 ? 8 : 0) | (b < 0 ? 4 : 0) | (c < 0 ? 2 : 0) | (d < 0 ? 1 : 0);
    if (code === 0 || code === 15) continue;
    const E = [() => hk(i, j), () => vk(i + 1, j), () => hk(i, j + 1), () => vk(i, j)];   // top, right, bottom, left
    const seg = (p, q) => link(E[p](), E[q]());
    const mid = (a + b + c + d) / 4 < 0;
    switch (code) {
      case 1: case 14: seg(3, 2); break;
      case 2: case 13: seg(2, 1); break;
      case 3: case 12: seg(3, 1); break;
      case 4: case 11: seg(0, 1); break;
      case 6: case 9: seg(0, 2); break;
      case 7: case 8: seg(3, 0); break;
      case 5: if (mid) { seg(0, 3); seg(1, 2); } else { seg(0, 1); seg(3, 2); } break;
      case 10: if (mid) { seg(0, 1); seg(2, 3); } else { seg(0, 3); seg(1, 2); } break;
    }
  }
  const loops = [], used = new Set();
  for (const start of adj.keys()) {
    if (used.has(start)) continue;
    const pts = [];
    let prev = -1, cur = start;
    while (cur !== undefined && !used.has(cur)) {
      used.add(cur);
      const p = pos.get(cur); pts.push(p[0], p[1]);
      const nb = adj.get(cur), next = nb[0] !== prev ? nb[0] : nb[1];
      prev = cur; cur = next;
    }
    let area = 0;
    for (let k = 0, n = pts.length; k < n; k += 2) area += pts[k] * pts[(k + 3) % n] - pts[(k + 2) % n] * pts[k + 1];
    if (pts.length >= 8 && Math.abs(area) > 80) loops.push(pts);
  }
  return loops;
}
// Smooth closed path through the loops (quadratic curves through the midpoints); filled with the even-odd rule so holes stay open
function loopsPath(loops) {
  const path = new Path2D();
  for (const L of loops) {
    const n = L.length / 2;
    path.moveTo((L[2 * n - 2] + L[0]) / 2, (L[2 * n - 1] + L[1]) / 2);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      path.quadraticCurveTo(L[2 * i], L[2 * i + 1], (L[2 * i] + L[2 * j]) / 2, (L[2 * i + 1] + L[2 * j + 1]) / 2);
    }
    path.closePath();
  }
  return path;
}

/* ======================================================================
   Ink geometry (CSS px, desktop coordinates): ink splash, white halo, impact spikes, splatter, sparkle spots
   ====================================================================== */
let icons = [];                                  // this screen's coordinates (share.js draws them); all monitors' icons, the others fall outside the screen
let iconsW = [];                                 // the same icons in desktop coordinates, set by buildGeometry
const iconRects = () => iconsW.map(ic => ({ cx: ic.x + ic.w / 2, cy: ic.y + ic.h / 2, hw: ic.w / 2 - 4, hh: ic.h / 2 - 2 }));
function nearIcon(x, y, m) {
  for (const ic of iconsW) if (x > ic.x - m && x < ic.x + ic.w + m && y > ic.y - m && y < ic.y + ic.h + m) return true;
  return false;
}
// a random point inside one of the monitors (desktop coordinates), keeping `m` from its edges and the taskbar
function pointOnMonitors(rnd, m) {
  const mon = WORLD.mons[(rnd() * WORLD.mons.length) | 0];
  return [mon[0] + m + (mon[2] - 2 * m) * rnd(), mon[1] + m + (mon[3] - TASKBAR - 2 * m) * rnd()];
}
function fieldRects() {
  if (P.adaptive) return iconRects();
  const rnd = mulberry32(seed * 7 + 3), out = [];   // not adapting: a few large splashes of their own (3 per monitor)
  for (let i = 0; i < 3 * WORLD.mons.length; i++) { const [x, y] = pointOnMonitors(rnd, 140); out.push({ cx: x, cy: y, hw: 60 + 120 * rnd(), hh: 50 + 90 * rnd(), w: 1 }); }
  return out;
}
const haloWidth = () => 10 + 22 * P.burst;       // white paper kept clear around the ink, so the spikes read against it
const spikeMax = () => 14 + 84 * P.burst;
function buildGeometry() {
  iconsW = icons.map(ic => ({ x: ic.x + WORLD.x, y: ic.y + WORLD.y, w: ic.w, h: ic.h }));
  const s = computeField(fieldRects()), halo = haloWidth(), Lmax = spikeMax();
  const edge = contours(s, 0);
  const geo = { s, ink: loopsPath(edge), rim: loopsPath(contours(s, -9)), halo: loopsPath(contours(s, halo)),
    spikes: new Path2D(), drops: new Path2D(), kira: [], rasters: [] };
  // Impact spikes: thin black wedges along the outline, pointing away from the ink (the field's gradient), mostly short with a few long ones
  const rnd = mulberry32(seed * 17 + 9);
  if (P.burst > 0) for (const L of edge) {
    const n = L.length / 2;
    let acc = 0, next = 0;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, ax = L[2 * i], ay = L[2 * i + 1], bx = L[2 * j], by = L[2 * j + 1], seg = Math.hypot(bx - ax, by - ay);
      while (next <= acc + seg) {
        const t = seg > 0 ? (next - acc) / seg : 0, px = ax + (bx - ax) * t, py = ay + (by - ay) * t;
        let gx = sampleArr(s, px + 3, py) - sampleArr(s, px - 3, py), gy = sampleArr(s, px, py + 3) - sampleArr(s, px, py - 3);
        const gl = Math.hypot(gx, gy) || 1; gx /= gl; gy /= gl;
        const long = rnd() < 0.18, len = Lmax * (long ? 0.72 + 0.28 * rnd() : 0.16 + 0.5 * rnd() * rnd()), w = (long ? 3.4 : 2) + 2.4 * rnd();
        const tx = -gy, ty = gx;
        geo.spikes.moveTo(px - gx * 3 + tx * w / 2, py - gy * 3 + ty * w / 2);
        geo.spikes.lineTo(px + gx * len, py + gy * len);
        geo.spikes.lineTo(px - gx * 3 - tx * w / 2, py - gy * 3 - ty * w / 2);
        geo.spikes.closePath();
        next += 3.5 + 4 * rnd();
      }
      acc += seg;
    }

  const DW = WORLD.w, DH = WORLD.h, nMon = WORLD.mons.length;
  for (let cy = 0; cy * 34 < DH; cy++) for (let cx = 0; cx * 34 < DW; cx++) {
    if (hash2(cx, cy, 51) > 0.1 * (0.25 + P.burst)) continue;
    const x = (cx + hash2(cx, cy, 52)) * 34, y = (cy + hash2(cx, cy, 53)) * 34, d = sampleArr(s, x, y);
    if (d < halo + Lmax * 0.35 || d > halo + Lmax + 46) continue;
    const r = 1.2 + 3.6 * hash2(cx, cy, 54) ** 2;
    geo.drops.moveTo(x + r, y); geo.drops.arc(x, y, r, 0, 6.2832);
    if (hash2(cx, cy, 55) < 0.5) { const a = hash2(cx, cy, 56) * 6.28, q = r * 0.45; geo.drops.moveTo(x + Math.cos(a) * r * 2.3 + q, y + Math.sin(a) * r * 2.3); geo.drops.arc(x + Math.cos(a) * r * 2.3, y + Math.sin(a) * r * 2.3, q, 0, 6.2832); }
  }
  // Sparkle spots: inside the ink, near its outline and away from the icons; 6 per monitor
  const kc = [];
  for (let cy = 0; cy * 44 < DH; cy++) for (let cx = 0; cx * 44 < DW; cx++) {
    const x = (cx + 0.2 + 0.6 * hash2(cx, cy, 61)) * 44, y = (cy + 0.2 + 0.6 * hash2(cx, cy, 62)) * 44, d = sampleArr(s, x, y);
    if (d > -14 || d < -42 || nearIcon(x, y, 14)) continue;
    kc.push({ x, y, h: hash2(cx, cy, 63), ph: hash2(cx, cy, 64) * 6.28, sz: 0.7 + 0.6 * hash2(cx, cy, 65), sp: 0.7 + 0.8 * hash2(cx, cy, 66) });
  }
  kc.sort((a, b) => a.h - b.h);
  for (const c of kc) {
    if (geo.kira.length >= 6 * nMon) break;
    if (geo.kira.some(o => Math.hypot(o.x - c.x, o.y - c.y) < 110)) continue;
    geo.kira.push(c);
  }
  return geo;
}

/* ======================================================================
   Page layout: rows of panels over the whole desktop, slanted dividers, some panels split in two
   Each panel: q = [TL, TR, BR, BL] (x, y pairs), its content type and its own seed
   ====================================================================== */
let panels = [];
function buildPanels() {
  const rnd = mulberry32(seed * 13 + 5), DW = WORLD.w, DH = WORLD.h, k = 1.55 - 1.05 * P.panels, G = 11, B = 40;
  // Most panels are inked backgrounds; a few are pure manga effects. fits: the panel shapes a scene needs (wide, tall enough, any)
  const TYPES = [['street', 14], ['skyline', 10], ['clouds', 12], ['mountains', 12], ['sea', 10], ['bamboo', 9], ['shrine', 9], ['moon', 10],
    ['focus', 5], ['speed', 3], ['hatch', 2], ['tone', 2]];
  const fits = (t, pw, ph) => t === 'mountains' || t === 'sea' ? pw >= ph * 1.15 : t === 'street' || t === 'shrine' ? ph >= 150 && pw <= ph * 2.4 :
    t === 'bamboo' ? ph >= 120 && pw <= ph * 2.6 : true;
  const total = TYPES.reduce((a, t) => a + t[1], 0);
  panels = [];
  const add = q => {
    const xs = [q[0], q[2], q[4], q[6]], ys = [q[1], q[3], q[5], q[7]];
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    let type = 'clouds';
    for (let tries = 0; tries < 10; tries++) {     // a scene that fits the panel and was not used in one of the last few panels
      let r = rnd() * total;
      for (const [t, w] of TYPES) { if (r < w) { type = t; break; } r -= w; }
      if (!fits(type, x1 - x0, y1 - y0)) continue;
      if (!panels.slice(-5).some(o => o.type === type)) break;
    }
    if (!fits(type, x1 - x0, y1 - y0)) type = 'clouds';
    panels.push({ q, type, seed: (rnd() * 1e9) | 0, sfx: rnd() < 0.3, x0, x1, y0, y1 });
  };
  for (let y0 = -B; y0 < DH + B;) {
    let y1 = y0 + (150 + 230 * rnd()) * k;
    if (DH + B - y1 < 110 * k) y1 = DH + B;
    const div = [[-B, -B]];                         // dividers: x at the top and at the bottom of the row
    for (let x = -B; ;) {
      x += (200 + 380 * rnd()) * k;
      if (DW + B - x < 140 * k) { div.push([DW + B, DW + B]); break; }
      const sl = rnd() < 0.6 ? (rnd() - 0.5) * 0.4 * (y1 - y0) : 0;
      div.push([x + sl / 2, x - sl / 2]);
    }
    for (let i = 1; i < div.length; i++) {
      const [a0, a1] = div[i - 1], [b0, b1] = div[i];
      const L = y => a0 + (a1 - a0) * (y - y0) / (y1 - y0) + G / 2, R = y => b0 + (b1 - b0) * (y - y0) / (y1 - y0) - G / 2;

    penLine(rim, lit ? [[bx - 2, ry], [bx + rw * 0.18, ry - rh * 0.2], [bx + rw * 0.28, ry - rh + 1]] : [[bx + rw * 0.72, ry - rh + 1], [bx + rw * 0.82, ry - rh * 0.2], [bx + rw + 2, ry]], 1.2, 0.6);

// A five-storey pagoda in silhouette: tiers that narrow upward, eaves with upturned tips, a spire with rings
function pagoda(x, px, gy, ph, pal, lx) {
  const ink = new Path2D(), rim = new Path2D(), tiers = 5, bw0 = ph * 0.2;
  let y = gy;
  for (let i = 0; i < tiers; i++) {
    const bw = bw0 * (1 - 0.1 * i), th = ph * 0.105 * (1 - 0.05 * i), ew = bw * 1.75;
    ink.rect(px - bw / 2, y - th, bw, th + 2);
    const ey = y - th;                              // eave: wide, thin in the middle, tips swept up
    ink.moveTo(px - ew / 2 - ew * 0.04, ey - ew * 0.09); ink.quadraticCurveTo(px - ew * 0.3, ey + 2, px, ey + 1);
    ink.quadraticCurveTo(px + ew * 0.3, ey + 2, px + ew / 2 + ew * 0.04, ey - ew * 0.09);
    ink.quadraticCurveTo(px + ew * 0.25, ey - ew * 0.06, px + bw * 0.4, ey - ew * 0.13); ink.lineTo(px - bw * 0.4, ey - ew * 0.13);
    ink.quadraticCurveTo(px - ew * 0.25, ey - ew * 0.06, px - ew / 2 - ew * 0.04, ey - ew * 0.09); ink.closePath();
    const s = lx < px ? -1 : 1;
    penLine(rim, [[px + s * ew * 0.52, ey - ew * 0.085], [px + s * ew * 0.28, ey - ew * 0.05], [px + s * bw * 0.4, ey - ew * 0.125]], 1.1, 0.5);
    y = ey - ew * 0.13;
  }
  ink.rect(px - 1.6, y - ph * 0.2, 3.2, ph * 0.2);  // spire with nine rings
  for (let k = 0; k < 9; k++) ink.ellipse(px, y - ph * 0.03 - k * ph * 0.016, 3.6 - k * 0.15, 1.3, 0, 0, 6.2832);
  x.fillStyle = pal.ink; x.fill(ink); x.fillStyle = pal.paper; x.fill(rim);
}

/* ----------------------------------------------------------------------
   Panels: the page is mostly inked backgrounds (streets, the city, skies, mountains, the sea, a bamboo grove, a shrine, a moonlit town),
   with a few pure manga effects (focus lines around a sound effect, speed lines, a beta flash, screentone)
   ---------------------------------------------------------------------- */
const SFX_TYPES = new Set(['tone', 'speed', 'hatch']);
const SIGNS = ['薬', '本', '喫茶', '酒', 'ラーメン', '理容', '湯', '写真'];
function drawPanel(x, p, pal) {
  const r = mulberry32(p.seed), w = p.x1 - p.x0, h = p.y1 - p.y0, cx = (p.x0 + p.x1) / 2, cy = (p.y0 + p.y1) / 2, E = Math.hypot(w, h) / 2 + 4;
  PANEL_BOX = { x0: p.x0 - 6, y0: p.y0 - 6, x1: p.x1 + 6, y1: p.y1 + 6 };
  const q = p.q, clip = new Path2D();
  clip.moveTo(q[0], q[1]); clip.lineTo(q[2], q[3]); clip.lineTo(q[4], q[5]); clip.lineTo(q[6], q[7]); clip.closePath();
  x.save(); x.clip(clip);
  x.lineCap = 'round'; x.lineJoin = 'round';
  if (p.type === 'tone') {                         // screentone gradient
    const a = r() * 6.283, ca = Math.cos(a), sa = Math.sin(a), lo = 0.05 + 0.2 * r(), hi = 0.55 + 0.4 * r();
    toneDots(x, p, (px, py) => lo + (hi - lo) * ss(-1, 1, ((px - cx) * ca + (py - cy) * sa) / E), 5 + 2 * r(), pal.tone);
  } else if (p.type === 'speed') {                 // parallel speed lines coming in from one side
    const a = [0, 0, Math.PI, 0.3, -0.3, Math.PI + 0.3, Math.PI / 2][(r() * 7) | 0], ca = Math.cos(a), sa = Math.sin(a), path = new Path2D();
    for (let o = -E; o < E; o += 2.5 + 3 * r()) {
      if (r() < 0.22) continue;
      const len = E * (0.45 + 1.25 * r()), ox = cx - sa * o, oy = cy + ca * o;
      wedge(path, ox - ca * (E + 10), oy - sa * (E + 10), ox - ca * (E + 10) + ca * len, oy - sa * (E + 10) + sa * len, 0.6 + 2.6 * r() * r());
    }
    x.fillStyle = pal.ink; x.fill(path);
  } else if (p.type === 'focus') {                 // focus lines converging on a sound effect
    const fx = p.x0 + w * (0.35 + 0.3 * r()), fy = p.y0 + h * (0.35 + 0.3 * r()), r0 = Math.min(w, h) * (0.18 + 0.1 * r());
    const n = 160 + ((100 * r()) | 0), R = Math.hypot(w, h), path = new Path2D();
    for (let i = 0; i < n; i++) {
      const a = (i + r() * 0.7) / n * 6.2832, inner = r0 * (1 + 0.8 * r() * r());
      wedge(path, fx + Math.cos(a) * R, fy + Math.sin(a) * R, fx + Math.cos(a) * inner, fy + Math.sin(a) * inner, Math.PI * R / n * (0.2 + 0.6 * r()));
    }
    x.fillStyle = pal.ink; x.fill(path);
    x.save(); x.translate(fx, fy); x.rotate((r() - 0.5) * 0.4);
    lettering(x, WORDS[(r() * WORDS.length) | 0], Math.max(28, Math.min(110, r0 * 0.75)), false, pal, r() * 6);
    x.restore();
  } else if (p.type === 'hatch') {                 // gradient of strokes coming from a solid edge (a "beta flash")
    const a = r() * 6.283, ca = Math.cos(a), sa = Math.sin(a), path = new Path2D(), reach = 0.35 + 0.35 * r();
    for (let o = -E; o < E; o += 2.6 + 0.8 * r()) {
      const sx = cx - ca * E - sa * o, sy = cy - sa * E + ca * o, len = E * 2 * reach * (0.55 + 0.45 * r()) + Math.sin(o * 0.07) * 14;
      wedge(path, sx, sy, sx + ca * len, sy + sa * len, 1.6 + 1.4 * r());
    }
    x.fillStyle = pal.ink; x.fill(path);
  } else if (SCENES[p.type]) {
    SCENES[p.type](x, p, r, pal, w, h, cx, cy);
    if (r() < 0.3 && w > 170 && h > 110) caption(x, p, r, pal);
  }
  if (p.sfx && SFX_TYPES.has(p.type) && w > 120 && h > 90) {   // a hollow sound effect painted into the panel
    x.save(); x.translate(p.x0 + w * (0.3 + 0.4 * r()), p.y0 + h * (0.3 + 0.4 * r())); x.rotate((r() - 0.5) * 0.6);
    lettering(x, WORDS[(r() * WORDS.length) | 0], Math.max(26, Math.min(86, Math.min(w, h) * 0.26)), false, pal, r() * 6);
    x.restore();
  }
  x.restore();
  x.lineWidth = 2.6; x.lineJoin = 'miter'; x.strokeStyle = pal.ink; x.stroke(clip);
  PANEL_BOX = null;
}

const SCENES = {
  // A shopping street in one-point perspective: buildings in depth with floors, windows, awnings and hanging signs, the left side
  // in shade casting shadows across the road, a crosswalk, utility poles and their tangle of wires against the sky
  street(x, p, r, pal, w, h) {
    const vx = p.x0 + w * (0.36 + 0.28 * r()), vy = p.y0 + h * (0.36 + 0.12 * r()), f = Math.max(w, h * 1.2) * 0.55, P3 = cam3(vx, vy, f, 1.6);
    const ZN = 1.4, ZF = 170, XS = 6, ink = pal.ink;
    toneDots(x, p, (px, py) => 0.3 * (1 - ss(p.y0, vy + 8, py)), 5, pal.tone);
    const blocks = [];
    for (const side of [-1, 1]) for (let z = ZN; z < ZF;) {
      const len = 5 + 11 * r();
      blocks.push({ side, z0: z, z1: z + len, H: 5.5 + 18 * r() * r() + (r() < 0.12 ? 14 : 0), dep: 8 + 6 * r(), shop: r() < 0.6, sign: r() < 0.45, ch: r() });
      z += len + (r() < 0.15 ? 2 : 0);
    }
    // ground: road in light tone, kerbs, shadows of the left-hand buildings, dashed centre line, a crosswalk
    const road = polyPath([P3(-4, 0, ZN), P3(4, 0, ZN), P3(4, 0, ZF), P3(-4, 0, ZF)]);
    x.save(); x.clip(road); toneDots(x, p, () => 0.14, 4.5, pal.tone); x.restore();
    const shade = new Path2D();
    for (const b of blocks) if (b.side < 0) { const sw = Math.min(8, b.H * 0.4); polyPath([P3(-XS, 0, b.z0), P3(-XS + sw, 0, b.z0 + 2), P3(-XS + sw, 0, b.z1 + 2), P3(-XS, 0, b.z1)], shade); }
    x.save(); x.clip(shade); toneDots(x, p, () => 0.7, 4.5, pal.tone); x.restore();
    const thin = new Path2D(), bold = new Path2D(), fills = new Path2D();
    for (const X of [-4, 4]) { seg(bold, P3(X, 0, ZN), P3(X, 0, ZF)); seg(thin, P3(X, 0.15, ZN), P3(X, 0.15, ZF)); }
    for (let z = ZN + 1; z < 90; z += 6) polyPath([P3(-0.08, 0, z), P3(0.08, 0, z), P3(0.08, 0, z + 3), P3(-0.08, 0, z + 3)], fills);
    const zc = 4 + 4 * r();
    for (let X = -3.6; X < 3.5; X += 0.9) polyPath([P3(X, 0, zc), P3(X + 0.45, 0, zc), P3(X + 0.45, 0, zc + 2.6), P3(X, 0, zc + 2.6)], fills);
    x.fillStyle = paperA(pal, 1); x.fill(fills);
    x.lineWidth = 0.8; x.strokeStyle = ink; x.stroke(fills); x.stroke(thin); x.lineWidth = 1.6; x.stroke(bold);
    // buildings, far to near
    blocks.sort((a, b) => b.z0 - a.z0);
    for (const b of blocks) {
      const s = b.side, X = s * XS, Xb = s * (XS + b.dep), lw = Math.min(2.4, 0.5 + 14 / b.z0), far = b.z0 > 45;
      const ef = [P3(X, 0, b.z0), P3(X, b.H, b.z0), P3(Xb, b.H, b.z0), P3(Xb, 0, b.z0)], efp = polyPath(ef);   // end wall facing us
      x.fillStyle = pal.paper; x.fill(efp);
      x.save(); x.clip(efp);
      if (far) toneDots(x, boxOf(ef), () => 0.4, 4, pal.tone);
      else hatch(x, boxOf(ef), () => 0.5, Math.PI / 2 + 0.03, ink, 3.2, 0.8, 2);
      x.restore();
      x.lineWidth = lw; x.strokeStyle = ink; x.stroke(efp);
      const fc = [P3(X, 0, b.z0), P3(X, b.H, b.z0), P3(X, b.H, b.z1), P3(X, 0, b.z1)], fcp = polyPath(fc);   // facade on the street
      x.fillStyle = pal.paper; x.fill(fcp);
      x.save(); x.clip(fcp);
      if (s < 0) toneDots(x, boxOf(fc), () => 0.45, 4.5, pal.tone);   // the left-hand side is in shade
      const lines = new Path2D(), dark = new Path2D(), glint = new Path2D();
      seg(lines, P3(X, b.H - 0.5, b.z0), P3(X, b.H - 0.5, b.z1));   // parapet
      if (b.z0 < 80) for (let Y = 3.4; Y + 2.4 < b.H; Y += 3) {
        seg(lines, P3(X, Y, b.z0), P3(X, Y, b.z1));
        if (far) continue;
        for (let z = b.z0 + 0.7; z + 1.3 < b.z1 - 0.4; z += 2.4) {
          const wq = [P3(X, Y + 0.9, z), P3(X, Y + 2.3, z), P3(X, Y + 2.3, z + 1.3), P3(X, Y + 0.9, z + 1.3)];
          if (r() < 0.35) { polyPath(wq, dark); seg(glint, P3(X, Y + 1.0, z + 0.3), P3(X, Y + 2.0, z + 0.8)); }
          else { polyPath(wq, lines); seg(lines, P3(X, Y + 0.9, z + 0.65), P3(X, Y + 2.3, z + 0.65)); }
        }
      }
      if (b.shop && !far) {                        // shop front: dark glass with mullions
        polyPath([P3(X, 0.3, b.z0 + 0.5), P3(X, 2.6, b.z0 + 0.5), P3(X, 2.6, b.z1 - 0.5), P3(X, 0.3, b.z1 - 0.5)], dark);
        for (let z = b.z0 + 2; z < b.z1 - 0.8; z += 1.6) seg(glint, P3(X, 0.3, z), P3(X, 2.6, z));
      }
      seg(lines, P3(X, 0, b.z1 - 0.3), P3(X, b.H, b.z1 - 0.3));   // drainpipe
      x.fillStyle = ink; x.fill(dark);
      x.lineWidth = Math.max(0.6, lw * 0.45); x.strokeStyle = ink; x.stroke(lines);
      x.lineWidth = 0.9; x.strokeStyle = pal.paper; x.stroke(glint);
      x.restore();
      x.lineWidth = lw; x.strokeStyle = ink; x.stroke(fcp);
      if (b.shop && !far) {                        // striped awning over the shop
        const za = b.z0 + 0.4, zb = b.z1 - 0.4, aw = polyPath([P3(X, 3.0, za), P3(X - s * 1.3, 2.5, za), P3(X - s * 1.3, 2.5, zb), P3(X, 3.0, zb)]);
        x.fillStyle = pal.paper; x.fill(aw);
        const st = new Path2D();
        for (let z = za; z < zb - 0.3; z += 0.7) polyPath([P3(X, 3.0, z), P3(X - s * 1.3, 2.5, z), P3(X - s * 1.3, 2.5, z + 0.35), P3(X, 3.0, z + 0.35)], st);

        const zs = b.z0 + 0.6, top = P3(X - s * 0.15, 4.2 + 4, zs), bot = P3(X - s * 1.25, 4.2, zs);
        const sx0 = Math.min(top[0], bot[0]), sx1 = Math.max(top[0], bot[0]), sy0 = top[1], sy1 = bot[1];
        x.fillStyle = pal.paper; x.fillRect(sx0, sy0, sx1 - sx0, sy1 - sy0); x.lineWidth = lw; x.strokeStyle = ink; x.strokeRect(sx0, sy0, sx1 - sx0, sy1 - sy0);
        const word = SIGNS[(b.ch * SIGNS.length) | 0], chars = [...word], fs = Math.min((sx1 - sx0) * 0.72, (sy1 - sy0) / (chars.length + 0.6));
        if (fs > 5) {

          chars.forEach((c, i) => x.fillText(c, (sx0 + sx1) / 2, sy0 + (sy1 - sy0) * (i + 0.5 + 0.3) / (chars.length + 0.6)));
        }
      }
    }
    // utility poles along the right kerb, wires between their tops and across the street
    const poleX = 4.7, zs = [];
    for (let z = 3 + 3 * r(); z < 110; z += 12) zs.push(z);
    const poles = new Path2D(), wires = new Path2D(), hi = new Path2D();
    for (const z of zs) {
      const a = P3(poleX, 0, z), b = P3(poleX, 9.5, z), pw = Math.max(1.2, 0.3 * f / z);
      poles.rect(a[0] - pw / 2, b[1], pw, a[1] - b[1]);
      penSeg(hi, a[0] - pw * 0.2, b[1] + pw, a[0] - pw * 0.2, a[1], Math.max(0.6, pw * 0.15), 0.3);
      const c0 = P3(poleX - 1, 8.7, z), c1 = P3(poleX + 1, 8.7, z), cw = Math.max(0.8, 0.14 * f / z);
      poles.rect(c0[0], c0[1] - cw / 2, c1[0] - c0[0], cw);
      if (z < 60 && Math.round(z) % 2 === 0) { const t = P3(poleX + 0.35, 7.4, z), tw = 0.55 * f / z; poles.rect(t[0] - tw / 2, t[1] - tw, tw, tw * 1.7); }
    }
    for (let i = 1; i < zs.length; i++) for (const ox of [-0.85, 0, 0.85]) {
      const pts = [];
      for (let k = 0; k <= 10; k++) { const t = k / 10, z = zs[i - 1] + (zs[i] - zs[i - 1]) * t; pts.push(P3(poleX + ox, 8.7 - 0.45 * Math.sin(Math.PI * t), z)); }
      penLine(wires, pts, Math.max(0.6, Math.min(2, 0.05 * f / zs[i - 1])), 0.1);
    }
    for (const z of zs.slice(1, 4)) {              // wires across the street to the left-hand buildings
      const pts = [];
      for (let k = 0; k <= 10; k++) { const t = k / 10; pts.push(P3(poleX - (poleX + XS) * t, 8.6 - 1.2 * t - 0.6 * Math.sin(Math.PI * t), z + 3 * t)); }
      penLine(wires, pts, Math.max(0.6, 0.04 * f / z), 0.1);
    }
    x.fillStyle = ink; x.fill(poles); x.fill(wires); x.fillStyle = pal.paper; x.fill(hi);
    birds(x, p, r, w, h, (r() * 3) | 0, pal);
  },
  // The city at night: a far skyline in fine tone, near towers in oblique view with a lit front, a dark side, windows and roof gear
  skyline(x, p, r, pal, w, h) {
    const gy = p.y1 - h * (0.02 + 0.05 * r());
    toneDots(x, p, (px, py) => 0.35 + 0.5 * (1 - ss(p.y0, gy, py)), 5, pal.tone);
    if (r() < 0.7) moonDisc(x, p.x0 + w * (0.15 + 0.7 * r()), p.y0 + h * (0.16 + 0.1 * r()), Math.min(w, h) * (0.08 + 0.04 * r()), pal);
    const far = new Path2D();
    for (let bx = p.x0 - 10; bx < p.x1 + 10;) { const bw = 8 + 22 * r(), bh = h * (0.3 + 0.35 * r()); far.rect(bx, gy - bh, bw + 1, bh + 20); bx += bw; }
    x.fillStyle = pal.paper; x.fill(far); x.save(); x.clip(far); toneDots(x, p, () => 0.7, 3.4, pal.tone); x.restore();
    for (let bx = p.x0 - 30; bx < p.x1 + 10;) {
      const bw = 26 + 52 * r(), bh = h * (0.12 + 0.42 * r()), dd = bw * (0.25 + 0.15 * r()), top = gy - bh, dy = dd * 0.42;
      const front = polyPath([[bx, top], [bx + bw, top], [bx + bw, gy + 20], [bx, gy + 20]]);
      const sideF = polyPath([[bx + bw, top], [bx + bw + dd, top - dy], [bx + bw + dd, gy + 20], [bx + bw, gy + 20]]);
      const roof = polyPath([[bx, top], [bx + dd, top - dy], [bx + bw + dd, top - dy], [bx + bw, top]]);
      x.fillStyle = pal.ink; x.fill(sideF);
      x.fillStyle = pal.paper; x.fill(roof); x.fill(front);
      x.save(); x.clip(front); toneDots(x, { x0: bx, y0: top, x1: bx + bw, y1: gy }, () => 0.68, 4, pal.tone); x.restore();
      const lit = new Path2D(), lines = new Path2D();
      for (let wy = top + 6; wy < gy - 6; wy += 8) for (let wx = bx + 4; wx < bx + bw - 6; wx += 6) if (r() < 0.3) lit.rect(wx, wy, 3, 4.4);
      for (let wy = top + 6; wy < gy; wy += 8) for (let k = 0; k < 2; k++) if (r() < 0.12) { const sx = bx + bw + dd * (0.25 + 0.4 * k); lit.moveTo(sx, wy - dy * 0.3 * k); lit.lineTo(sx + 3, wy - dy * 0.3 * k - 1.3); lit.lineTo(sx + 3, wy + 3 - dy * 0.3 * k); lit.lineTo(sx, wy + 4.3 - dy * 0.3 * k); lit.closePath(); }
      for (let lx = bx + bw / 4; lx < bx + bw; lx += bw / 4) seg(lines, [lx, top], [lx, gy]);
      x.fillStyle = pal.paper; x.fill(lit);
      x.lineWidth = 0.6; x.strokeStyle = pal.ink; x.stroke(lines);
      x.lineWidth = 1.3; x.stroke(front); x.stroke(roof); x.stroke(sideF);
      const gear = r(), gx = bx + bw * (0.25 + 0.4 * r()), gyy = top - dy * 0.5;   // roof gear: a water tank, an antenna mast or nothing
      if (gear < 0.35) { x.fillStyle = pal.ink; x.fillRect(gx - 7, gyy - 16, 14, 11); x.fillRect(gx - 6, gyy - 5, 1.6, 6); x.fillRect(gx + 4.4, gyy - 5, 1.6, 6); x.beginPath(); x.ellipse(gx, gyy - 16, 7, 2.5, 0, 0, 6.2832); x.fill(); }
      else if (gear < 0.65) { const mh = 20 + 30 * r(); x.lineWidth = 1.4; x.strokeStyle = pal.ink; x.beginPath(); x.moveTo(gx, gyy); x.lineTo(gx, gyy - mh); for (let k = 1; k < 4; k++) { x.moveTo(gx - 6 + k, gyy - mh * k / 4); x.lineTo(gx + 6 - k, gyy - mh * k / 4); } x.stroke(); }
      bx += bw + dd * (0.4 + 0.5 * r());
    }
  },
  // A towering summer cumulonimbus over a low horizon of roofs, often framed by a utility pole and its wires
  clouds(x, p, r, pal, w, h) {
    const hz = p.y1 - h * (0.08 + 0.1 * r());
    toneDots(x, p, (px, py) => 0.12 + 0.52 * (1 - ss(p.y0, hz, py)), 5, pal.tone);
    const cw = w * (0.45 + 0.3 * r()), ch = Math.min(h * (0.6 + 0.25 * r()), cw * 1.4), ccx = p.x0 + w * (0.3 + 0.4 * r());
    if (r() < 0.6) cloudMass(x, ccx + (r() < 0.5 ? -1 : 1) * cw * 0.7, hz - 3, cw * 0.4, ch * 0.35, r, pal);
    cloudMass(x, ccx, hz - 2, cw, ch, r, pal);
    const town = new Path2D(); town.moveTo(p.x0 - 10, p.y1 + 10);
    for (let tx = p.x0 - 10; tx < p.x1 + 10;) { const th = 2 + 11 * r() * r(), tw = 6 + 14 * r(); town.lineTo(tx, hz - th); town.lineTo(tx + tw, hz - th); tx += tw; }
    town.lineTo(p.x1 + 10, p.y1 + 10); town.closePath();
    x.fillStyle = pal.paper; x.fill(town); x.save(); x.clip(town); toneDots(x, p, () => 0.55, 3.4, pal.tone); x.restore();

  // paper grain: sparse faint specks on a desktop-anchored grid
  x.fillStyle = pal.ink; x.globalAlpha = 0.07;
  for (let cy = Math.floor(VY / 7); cy * 7 < VY + H; cy++) for (let cx = Math.floor(VX / 7); cx * 7 < VX + W; cx++) {
    if (hash2(cx, cy, 71) > 0.08) continue;
    x.fillRect(cx * 7 + hash2(cx, cy, 72) * 7, cy * 7 + hash2(cx, cy, 73) * 7, 0.8, 0.8);
  }
  x.globalAlpha = 1;
  return c;
}
// Ink of one icon layout, on a transparent layer: white halo, splatter, spikes, solid ink and a thin white rim inside it
function buildInk(geo, cw, ch, s) {
  const c = makeCanvas(cw, ch), x = c.getContext('2d'), pal = PALS[P.palette];
  x.setTransform(s, 0, 0, s, -WORLD.x * s, -WORLD.y * s);
  x.fillStyle = pal.paper; x.fill(geo.halo, 'evenodd');
  x.fillStyle = pal.ink; x.fill(geo.drops); x.fill(geo.spikes); x.fill(geo.ink, 'evenodd');
  x.lineWidth = 1.6; x.strokeStyle = pal.paper; x.globalAlpha = 0.85; x.stroke(geo.rim); x.globalAlpha = 1;
  return c;
}

/* ======================================================================
   Moving things: cherry petals, sound effects, crow. All of them are functions of the shared clock and the seed,
   so on every monitor they are in the same place at the same moment
   ====================================================================== */
let petals = [];
function initMovers() {
  const r = mulberry32(seed + 77);
  petals = [];
  for (let i = 0, n = 60 * WORLD.mons.length; i < n; i++)
    petals.push({ x0: r(), y0: r(), sp: r(), ph: r() * 6.28, sz: 5.5 + 4 * r(), spin: 0.6 + 1.4 * r() });
  popCache.clear();
}
function petalAt(p, T, out) {                    // desktop coordinates at time T (the petals wrap around a band 100px wider than the desktop)
  const spanX = WORLD.w + 200, spanY = WORLD.h + 200, f = P.flow;
  const x = p.x0 * spanX + (10 + 14 * p.sp) * f * T + Math.sin(T * 0.8 * (0.6 + p.sp) + p.ph) * 28;
  const y = p.y0 * spanY + (18 + 16 * p.sp) * f * T;
  out[0] = mod(x, spanX) - 100; out[1] = mod(y, spanY) - 100;
}
const PETAL = (() => {                           // unit petal: an oval with a notch at its tip
  const p = new Path2D();
  p.moveTo(0, -0.62); p.lineTo(-0.3, -1); p.bezierCurveTo(-0.95, -0.6, -0.7, 0.75, 0, 1);
  p.bezierCurveTo(0.7, 0.75, 0.95, -0.6, 0.3, -1); p.closePath();
  return p;
})();

// Sound effects: per monitor, one chance every POP_PERIOD seconds; the word pops in, holds, trembles if it is a rumble, then fades
const POP_PERIOD = PREVIEW ? 3.5 : 8, POP_DUR = 3;
const popCache = new Map();
function makePop(mi, slot) {
  const r = mulberry32(seed * 131 + slot * 7919 + mi * 104729);
  if (r() >= P.sfx) return null;
  const mon = WORLD.mons[mi], word = WORDS[(r() * WORDS.length) | 0], size = 46 + 34 * r(), tw = size * [...word].length * 0.62 + 30, th = size * 0.75 + 20;
  if (mon[2] < tw + 60 || mon[3] < th + TASKBAR + 60) return null;
  for (let t = 0; t < 14; t++) {
    const x = mon[0] + 30 + tw / 2 + (mon[2] - tw - 60) * r(), y = mon[1] + 30 + th / 2 + (mon[3] - TASKBAR - th - 60) * r();
    let clear = true;
    for (const ic of iconsW) if (ic.x < x + tw / 2 + 20 && ic.x + ic.w > x - tw / 2 - 20 && ic.y < y + th / 2 + 20 && ic.y + ic.h > y - th / 2 - 20) { clear = false; break; }
    if (!clear) continue;
    return { x, y, word, size, ang: (r() - 0.5) * 0.5, ph: r() * 6, start: slot * POP_PERIOD + r() * POP_PERIOD * 0.4 };
  }
  return null;
}
function popsAt(T, out) {
  out.length = 0;
  if (P.sfx <= 0) return out;
  const cur = Math.floor(T / POP_PERIOD);
  for (let mi = 0; mi < WORLD.mons.length; mi++) for (const slot of [cur, cur - 1]) {
    const key = mi + ':' + slot;
    let p = popCache.get(key);
    if (p === undefined) { p = makePop(mi, slot); popCache.set(key, p); if (popCache.size > 64) popCache.delete(popCache.keys().next().value); }
    if (!p) continue;
    const u = T - p.start;
    if (u >= 0 && u < POP_DUR) out.push([p, u]);
  }
  return out;
}
function drawPop(x, p, u, pal) {
  const t = Math.min(u / 0.22, 1), back = 1 + 2.2 * (t - 1) ** 3 + 1.2 * (t - 1) ** 2;   // ease-out with a small overshoot
  const k = u < 0.22 ? back : 1, a = u > POP_DUR - 0.5 ? (POP_DUR - u) / 0.5 : 1;
  const shake = SHAKY.has(p.word) ? Math.sin(u * 55) * 1.8 : 0;
  x.save(); x.translate(p.x + shake, p.y + shake * 0.4); x.rotate(p.ang); x.scale(k, k); x.globalAlpha = a;
  if (IMPACT.has(p.word)) {                        // short burst lines behind the word
    const path = new Path2D(), rx = p.size * [...p.word].length * 0.42 + 10, ry = p.size * 0.62 + 6;
    for (let i = 0; i < 18; i++) {
      const ang = i / 18 * 6.2832 + Math.sin(i * 3.1) * 0.12, l = 0.25 + 0.2 * (0.5 + 0.5 * Math.sin(i * 5.7));
      const ox = Math.cos(ang) * rx, oy = Math.sin(ang) * ry;
      wedge(path, ox * (1 + l), oy * (1 + l), ox, oy, 4);
    }
    x.fillStyle = pal.ink; x.fill(path);
  }
  lettering(x, p.word, p.size, true, pal, p.ph);
  x.restore();
}

// Crow: crosses the whole desktop now and then, flapping, with a few speed lines behind and, sometimes, its call
const CROW_PERIOD = PREVIEW ? 16 : 38;
function crowAt(T) {
  if (!P.crow) return null;
  for (const slot of [Math.floor(T / CROW_PERIOD), Math.floor(T / CROW_PERIOD) - 1]) {
    const r = mulberry32(seed * 37 + slot);
    if (r() < 0.3 && !PREVIEW) continue;           // now and then a period without a crow
    const start = slot * CROW_PERIOD + 1 + r() * CROW_PERIOD * 0.3;
    const fromLeft = r() < 0.5, y0 = WORLD.h * (0.08 + 0.5 * r()), y1 = WORLD.h * (0.08 + 0.5 * r());
    const A = [fromLeft ? -80 : WORLD.w + 80, y0], B = [fromLeft ? WORLD.w + 80 : -80, y1];
    const dur = Math.hypot(B[0] - A[0], B[1] - A[1]) / 180, u = (T - start) / dur, bend = (r() - 0.5) * WORLD.h * 0.2, flap0 = r() * 6, aho = r() < 0.6;
    if (u < 0 || u >= 1) continue;
    return { x: A[0] + (B[0] - A[0]) * u, y: A[1] + (B[1] - A[1]) * u + Math.sin(Math.PI * u) * bend + Math.sin(T * 2.6) * 5,
      dir: fromLeft ? 1 : -1, flap: T * 9 + flap0, u, aho };
  }
  return null;
}
function drawCrow(x, c, pal) {
  const wy = Math.sin(c.flap);
  x.save(); x.translate(c.x, c.y); x.scale(c.dir * 2.1, 2.1);
  x.strokeStyle = pal.ink; x.lineWidth = 1; x.globalAlpha = 0.75; x.beginPath();
  for (const [oy, l] of [[-3, 34], [2, 46], [7, 28]]) { x.moveTo(-26, oy); x.lineTo(-26 - l, oy); }
  x.stroke(); x.globalAlpha = 1;
  const wing = (k, off) => {                       // one wing: curved leading edge up to the tip, fingered primaries along the trailing edge
    const p = new Path2D(), ty = -30 * wy * k + off, tx = -8 - 5 * (1 - Math.abs(wy)), rx = -9, ry = -1;
    p.moveTo(7, -3);
    p.quadraticCurveTo(5, ty * 0.75, tx, ty);
    for (let i = 1; i <= 4; i++) {                 // feather tips stick out backwards between the tip and the root
      const t = i / 5, bx = tx + (rx - tx) * t, by = ty + (ry - ty) * t;
      p.lineTo(bx - 7 * (1 - t * 0.6), by - Math.sign(ty || 1) * 1.5); p.lineTo(bx, by);
    }
    p.quadraticCurveTo(rx + 2, ry, 0, 2); p.closePath();
    return p;
  };
  const body = new Path2D();
  body.ellipse(0, 0, 14, 6, -0.05, 0, 6.2832);
  body.moveTo(17, -6); body.arc(12, -3, 5.5, 0, 6.2832);
  body.moveTo(16, -5); body.lineTo(26, -2.5); body.lineTo(16, -0.5); body.closePath();
  body.moveTo(-12, -3); body.lineTo(-25, -6); body.lineTo(-24, 4); body.lineTo(-12, 3); body.closePath();
  const parts = [wing(0.8, 2), body, wing(1, 0)];
  x.lineJoin = 'round';
  for (const p of parts) { x.lineWidth = 3; x.strokeStyle = pal.paper; x.stroke(p); x.fillStyle = pal.ink; x.fill(p); }
  x.fillStyle = pal.paper; x.beginPath(); x.arc(13.5, -4, 1, 0, 6.2832); x.fill();
  x.restore();
  if (c.aho && c.u > 0.35 && c.u < 0.7) {          // its call, trailing behind
    const a = Math.min(1, (c.u - 0.35) / 0.05, (0.7 - c.u) / 0.05);
    x.save(); x.globalAlpha = a; x.translate(c.x - c.dir * 70, c.y - 50); x.rotate(-0.12 * c.dir);
    lettering(x, 'アホー', 22, true, pal, 1);
    x.restore();
  }
}

/* ======================================================================
   Frame
   ====================================================================== */
let geoOld = null, geoNew = null, morphT0 = -1e9, morphDur = MORPH_MS;
function commit(fromEmpty = false) {
  const g = buildGeometry();
  geoOld = fromEmpty ? null : geoNew; geoNew = g;
  morphT0 = performance.now(); morphDur = fromEmpty ? 2400 : MORPH_MS;
  popCache.clear();                              // the sound effects avoid the icons: place them again
  if (paused) { morphT0 = -1e9; draw(performance.now()); }   // paused: show the final state right away
}
let rebuildT = 0, panelsT = 0;
function rebuildSoon() { clearTimeout(rebuildT); rebuildT = setTimeout(() => commit(false), PREVIEW ? 40 : 160); }
function panelsSoon() {
  clearTimeout(panelsT);
  panelsT = setTimeout(() => { buildPanels(); baseCache.length = 0; if (paused && iconsSeen) draw(performance.now()); }, PREVIEW ? 40 : 160);
}

function resize() {
  W = innerWidth; H = innerHeight;
  // Preview mode: the page is laid out at the full desktop size and then scaled down as a whole, so the canvas only needs a low resolution
  const scale = PREVIEW ? 0.45 : devicePixelRatio || 1;
  // Use the size the canvas actually occupies (with decimals), otherwise the browser rescales the whole picture and blurs it
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  if (!WORLD.set) WORLD = { x: 0, y: 0, w: W, h: H, mons: [[0, 0, W, H]], set: false };   // no layout from the host: the desktop is this screen
  buildNoise(); buildPanels();
  baseCache.length = 0;
}
// The host told us where this monitor sits in the whole desktop (or that the desktop changed): recompute the scene over the new desktop
function setLayout(m) {
  const before = JSON.stringify(WORLD);
  applyDesktop(m);
  if (JSON.stringify(WORLD) === before) return;
  buildNoise(); buildPanels(); baseCache.length = 0; initMovers();
  if (iconsSeen) { commit(false); morphT0 = -1e9; }
}

let lastT = 0, frameN = 0;
let paused = false;                              // host notification: a maximized / fullscreen window hides this monitor → pause
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (P.cap30 && now - lastT < 31) return;
  lastT = now;
  draw(now);
  frameN++;
}
const pp = [0, 0], pops = [];
function draw(now) {
  const s = cv._scale, T = wallClock(), e = Math.min(Math.max((now - morphT0) / morphDur, 0), 1), pal = PALS[P.palette];
  const VX = WORLD.x, VY = WORLD.y;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(cached(baseCache, buildBase), 0, 0);
  const aOld = geoOld && e < 1 ? 1 - ss(0.35, 1, e) : 0, aNew = geoNew ? (geoOld ? ss(0, 0.65, e) : ss(0, 1, e)) : 0;
  if (aOld > 0) { ctx.globalAlpha = aOld; ctx.drawImage(cached(geoOld.rasters, (w, h, k) => buildInk(geoOld, w, h, k)), 0, 0); }
  if (aNew > 0) { ctx.globalAlpha = aNew; ctx.drawImage(cached(geoNew.rasters, (w, h, k) => buildInk(geoNew, w, h, k)), 0, 0); }
  ctx.setTransform(s, 0, 0, s, -VX * s, -VY * s); // desktop coordinates from here on
  for (const [g, a] of [[geoOld, aOld], [geoNew, aNew]]) {   // sparkles twinkling on the ink
    if (!g || a <= 0) continue;
    for (const c of g.kira) {
      if (c.x < VX - 30 || c.x > VX + W + 30 || c.y < VY - 30 || c.y > VY + H + 30) continue;
      const tw = Math.sin(T * 1.6 * c.sp + c.ph);
      if (tw <= 0) continue;
      ctx.globalAlpha = a * tw;
      star(ctx, c.x, c.y, (5 + 9 * tw) * c.sz, pal.paper, null);
    }
  }
  ctx.globalAlpha = 1;
  const n = Math.min(petals.length, P.petals * WORLD.mons.length);
  ctx.lineWidth = 0.18; ctx.strokeStyle = pal.ink; ctx.fillStyle = pal.petal;
  for (let i = 0; i < n; i++) {
    const p = petals[i];
    petalAt(p, T, pp);
    if (pp[0] < VX - 12 || pp[0] > VX + W + 12 || pp[1] < VY - 12 || pp[1] > VY + H + 12) continue;
    const a = T * p.spin + p.ph, ca = Math.cos(a), sa = Math.sin(a), fl = (0.35 + 0.65 * Math.abs(Math.cos(T * p.spin * 1.3 + p.ph))) * p.sz;
    ctx.setTransform(s * ca * p.sz, s * sa * p.sz, -s * sa * fl, s * ca * fl, (pp[0] - VX) * s, (pp[1] - VY) * s);
    ctx.fill(PETAL); ctx.stroke(PETAL);
  }
  ctx.setTransform(s, 0, 0, s, -VX * s, -VY * s);
  for (const [p, u] of popsAt(T, pops)) {
    if (p.x + p.size * 4 < VX || p.x - p.size * 4 > VX + W || p.y + p.size * 2 < VY || p.y - p.size * 2 > VY + H) continue;
    drawPop(ctx, p, u, pal);
  }
  const crow = crowAt(T);
  if (crow && crow.x > VX - 180 && crow.x < VX + W + 180) drawCrow(ctx, crow, pal);
  ctx.globalAlpha = 1;
}

/* ======================================================================
   Hosted mode: the scene is driven from outside
   - Wallpaper mode (?wallpaper=1): the desktop host sends messages through WebView2
   - Preview mode (?preview=1): the settings window sends messages through the iframe's postMessage
   Messages: layout (where this monitor sits in the desktop) / icons (real icon rectangles, physical pixels) /
   settings (parameters, partial update) / reset (restore defaults) / pause
   ====================================================================== */
let iconsSeen = false;
function reseed(v) {
  seed = v; buildNoise(); buildPanels(); baseCache.length = 0; initMovers();
  if (iconsSeen) commit(true);
}
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);   // "Refresh" in the settings window: new scene (desktop and preview use the same seed)
  let geometry = false, redraw = false;
  for (const k in v) {
    const r = RANGES[k];
    if (!r || typeof v[k] !== 'number' || !Number.isFinite(v[k])) continue;
    const val = Math.min(r[1], Math.max(r[0], r[2] ? Math.round(v[k]) : v[k]));
    if (P[k] === val) continue;
    P[k] = val;
    if (GEOMETRY_KEYS.includes(k)) geometry = true;
    if (k === 'panels') panelsSoon();
    if (k === 'sfx') popCache.clear();
    if (k === 'palette') redraw = true;            // the cached layers are kept per palette: nothing to rebuild
  }
  if (geometry && iconsSeen) rebuildSoon();
  else if (redraw && paused && iconsSeen) draw(performance.now());
}
function drawGhosts() {
  document.getElementById('ghosts').innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) document.body.classList.add('ghosts');
  let first = true;
  const settlePaused = () => { if (paused && iconsSeen) { morphT0 = -1e9; draw(performance.now()); } };
  const handle = m => {
    if (m.t === 'pause') { paused = PREVIEW ? false : m.v; settlePaused(); return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t === 'layout') { setLayout(m); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical pixels → CSS pixels
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    clearTimeout(rebuildT);
    commit(first);                                // first time: the ink fades in; afterwards: old and new ink cross-fade
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
// Opened directly in a browser: a sample desktop (for work on the theme); R = new scene
function startStandalone() {
  document.body.classList.add('ghosts');
  const cell = (c, r) => ({ x: GRID_X0 + c * CELL_W, y: GRID_Y0 + r * CELL_H, w: CELL_W, h: 92 });
  icons = [];
  for (let c = 0; c < 2; c++) for (let r = 0; r < Math.min(7, Math.floor((H - TASKBAR) / CELL_H)); r++) icons.push(cell(c, r));
  for (const [c, r] of [[7, 1], [8, 1], [8, 2], [13, 4], [14, 4], [19, 0], [19, 1]]) if (GRID_X0 + (c + 1) * CELL_W < W) icons.push(cell(c, r));
  drawGhosts();
  iconsSeen = true;
  commit(true);
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reseed((Math.random() * 1e6) | 0); });
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); initMovers(); if (iconsSeen) { commit(false); morphT0 = -1e9; } }, 100);
});

resize();
initMovers();
if (WALL || PREVIEW) startHostedMode(); else startStandalone();
requestAnimationFrame(frame);
</script>
<script src="share.js"></script>   <!-- Share image / share animation (sample icons, names as color blocks) -->
