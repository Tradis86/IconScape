<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconScape · Steampunk</title>
<!--
  IconScape · steampunk theme (front view of a machine wall; Canvas 2D), drawn as by hand
  Art direction: an old, rusty, patched machine in muted sepia, rust and verdigris, as in hand-painted point-and-click adventures:
  the icons sit on worn riveted sheets with patches, stains and rust drips; trains of gears turn in the free space; pipes leave the
  sheets and end in pressure gauges, joints leak puffs of steam, cables sag across the wall with warm light bulbs, and now and then
  a patched airship drifts by. Every line is a wobbly pencil line gone over twice, shadows are pencil hatching, colours are washes
  - Plates: the same icon field as the other themes (without warping), traced with marching squares on a coarse grid
  - Gears: trains grown from seed gears; every gear touches only its parent, with the tooth count fixing the radius, so the teeth really mesh:
    a child's angle is computed from its parent's angle and the two tooth counts
  - The wall, sheets, pipes, dials, cables and gear shadows are static and cached at the screen's actual pixels (old and new scene cross-fade when the icons move)
  - Every frame only draws small things: the gears (each one a small sprite drawn once, then only rotated), gauge needles, bulb glows, steam puffs, the airship
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3b352b; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* Preview mode (?preview=1, inside the settings window) and standalone mode: translucent blocks mark where the icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.ghosts #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(0,0,0,.4); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="ghosts"></div>
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;   // desktop grid (also used by share.js)
const STEP = 6;                                  // field grid (CSS px)
const PG = 14;                                   // pipe routing grid (CSS px)
const ZG = 26;                                   // plate grid (CSS px): coarse, so the plates have long straight edges and 45° chamfers
const PITCH = 13;                                // distance between two gear teeth along the pitch circle (CSS px): the same for every gear, so any two can mesh
const FLOOR_H = 24, BEAM_H = 16;                 // the room on every monitor: a plank floor above the taskbar, an iron beam along the top
// sizes of the odds and ends in their own units (they are drawn at a scale of their own)
const PROP_SIZE = { porthole: [40, 40], hatch: [46, 62], ladder: [24, 130], box: [40, 52], lever: [30, 46], tank: [46, 62], chimney: [26, 84], sign: [42, 28],
  meter: [34, 40], fan: [44, 44], shelf: [70, 34], chain: [16, 92], pulley: [36, 112], spring: [20, 52], tap: [40, 30], clock: [46, 46], speaker: [34, 36],
  boiler: [84, 116], window: [62, 84], catwalk: [150, 40], door: [58, 104], crate: [40, 34], barrel: [30, 42], bucket: [22, 20], coal: [52, 22], bench: [104, 46], board: [96, 64], lamp: [26, 60] };
const MORPH_MS = 1400;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');                // wallpaper mode: loaded by the desktop host; messages come from the host
const PREVIEW = QS.has('preview');               // preview mode: the preview (iframe) in the settings window; messages come from the parent page
// The whole desktop (CSS px): the machine is laid out over all monitors in these coordinates and this page draws only its own monitor,
// which sits at (WORLD.x, WORLD.y); mons: the monitors' rectangles. Without a layout from the host the desktop is this screen alone
let WORLD = { x: 0, y: 0, w: innerWidth, h: innerHeight, mons: [[0, 0, innerWidth, innerHeight]], set: false };
function applyDesktop(m) {
  const k = window.devicePixelRatio || 1;          // physical pixels → CSS pixels

  if (!WORLD.mons.length) WORLD.mons = [[WORLD.x, WORLD.y, innerWidth, innerHeight]];
}
const wallClock = () => Date.now() / 1000;       // shared by the pages of all monitors: a gear train or the airship crossing monitors stays in step
// Defaults must match the "default" values of the steampunk theme in themes.json
const P = { sigma: 50, metal: 0, gears: 0.6, details: 0.8, speed: 1, pipes: 6, steam: 0.5, airship: 1, adaptive: 1, cap30: true };
const DEFAULTS = Object.assign({}, P);
// Accepted parameters: [min, max, integer]
const RANGES = { sigma: [30, 140], metal: [0, 2, 1], gears: [0, 1], details: [0, 1], speed: [0, 3], pipes: [0, 12, 1], steam: [0, 1], airship: [0, 1, 1], adaptive: [0, 1, 1] };
const GEOMETRY_KEYS = ['sigma', 'gears', 'details', 'pipes', 'adaptive'];
// Metals, as in an old rusty machine painted by hand: rust, verdigris, iron (and a dull bronze for some gears). plate: the worn sheets
// under the icons (light, mid, dark; dark enough for the white icon names); hi / mid / lo: gears and fittings; stain: rust streaks and
// spots; wall: the backdrop (top, bottom)
const METALS = [
  { hi: '#e2b98a', mid: '#a8703e', lo: '#4c2e18', plate: ['#8a6a4c', '#6a4e38', '#46321f'], stain: '#a85a26', wall: ['#6b5c46', '#3d3326'] },
  { hi: '#c4d8bc', mid: '#73917c', lo: '#2b3c33', plate: ['#6a7e70', '#4c5f53', '#313f37'], stain: '#3f8a76', wall: ['#58594a', '#34352a'] },
  { hi: '#d6d4c8', mid: '#84837e', lo: '#36363a', plate: ['#74726c', '#55534f', '#383633'], stain: '#9a5a30', wall: ['#615a4c', '#3a342c'] },
  { hi: '#d8b67a', mid: '#9a7a44', lo: '#43301a' },

/* ======================================================================
   Random numbers and noise (seeded: desktop and preview show the same machine)
   ====================================================================== */
let seed = WALL || PREVIEW ? 7919 : (Math.random() * 1e6) | 0;   // hosted: the same default on every monitor until the settings give one
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

}
function vnoise(x, y, k = 0) {

  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;

const ss = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

/* ======================================================================
   Hand-drawn toolkit: wobbly pencil lines gone over twice, pencil hatching, watercolour washes
   Everything is anchored to desktop coordinates (the noise follows the line, the hatching lines sit on a desktop-wide lattice),
   so a shape cut by the edge between two monitors is drawn the same on both
   ====================================================================== */
const INK = '#2b1d13';                           // sepia pencil
function densify(pts, step = 4, closed = false) {
  const out = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const a = pts[i], b = pts[(i + 1) % n], k = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);
  }

}
// every point pushed sideways by a smooth noise of the distance along the line: a hand that wavers a little
function wobble(pts, amp, k) {

    if (i) acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];

function polyline(x, pts, closed) { x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); if (closed) x.closePath(); x.stroke(); }
// A sketched line: a firm stroke and a lighter one that does not quite follow it
function sketch(x, pts, closed = false, w = 1.4, col = INK, amp = 1) {

  const d = densify(pts, 4, closed);
  x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = col;
  const a0 = x.globalAlpha;
  x.globalAlpha = a0 * 0.85; x.lineWidth = w; polyline(x, wobble(d, 1.4 * amp, 1), closed);
  x.globalAlpha = a0 * 0.55; x.lineWidth = w * 0.65; polyline(x, wobble(d, 2.8 * amp, 2), closed);
  x.globalAlpha = a0;
}
const circlePts = (cx, cy, r, n = Math.max(12, Math.round(r * 0.9))) => Array.from({ length: n }, (_, i) => [cx + Math.cos(i / n * 6.2832) * r, cy + Math.sin(i / n * 6.2832) * r]);
// Pencil hatching inside the current clip, over the box b: parallel slanted strokes on a desktop-wide lattice, broken where shade(x, y) is low
function pencilHatch(x, b, shade, ang = 0.85, sp = 4, alpha = 0.32, key = 0, col = INK) {
  const ca = Math.cos(ang), sa = Math.sin(ang), path = new Path2D();

  for (const [px, py] of [[b.x0, b.y0], [b.x1, b.y0], [b.x0, b.y1], [b.x1, b.y1]]) {
    const o = -sa * px + ca * py, u = ca * px + sa * py;
    o0 = Math.min(o0, o); o1 = Math.max(o1, o); u0 = Math.min(u0, u); u1 = Math.max(u1, u);
  }
  for (let k = Math.floor(o0 / sp); k * sp <= o1 + sp; k++) {
    const o = (k + (hash2(k, key, 97) - 0.5) * 0.6) * sp;
    let on = false;
    for (let j = Math.floor(u0 / 3); j * 3 <= u1 + 3; j++) {
      const u = j * 3, px = ca * u - sa * o, py = sa * u + ca * o;
      if (shade(px, py) - hash2(j, k, 98 + key) * 0.3 > 0.35) {
        const jx = (hash2(j, k, 99) - 0.5) * 0.9, jy = (hash2(k, j, 99) - 0.5) * 0.9;
        if (on) path.lineTo(px + jx, py + jy); else path.moveTo(px + jx, py + jy);
        on = true;
      } else on = false;

// Watercolour wash: the shape in a base colour, soft blotches of darker and lighter paint, and pigment pooled along the edge.
// The blotches sit on desktop-wide cells; only the cells near this screen's box are painted
function wash(x, path, base, dark, light, box, s, key = 0, rule = 'nonzero', ad = 0.45, al = 0.3) {
  x.fillStyle = base; x.fill(path, rule);
  x.save(); x.clip(path, rule);
  const d = new Path2D(), l = new Path2D(), G = 80;
  for (let cy = Math.floor(box.y0 / G) - 1; cy * G < box.y1 + G; cy++) for (let cx = Math.floor(box.x0 / G) - 1; cx * G < box.x1 + G; cx++) {
    const h = hash2(cx, cy, 120 + key);

  x.globalAlpha = ad; x.fillStyle = dark; x.fill(d);
  x.globalAlpha = al; x.fillStyle = light; x.fill(l);
  x.filter = `blur(${Math.max(1, Math.round(2.5 * s))}px)`; x.globalAlpha = 0.45; x.lineWidth = 7; x.strokeStyle = dark; x.stroke(path);

/* ======================================================================
   Icon field (CPU): s = signed distance to the edge of the plates (<0 is on a plate), as in the other themes
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1;   // W, H: this screen (share.js uses them too); the field grid covers the whole desktop
function computeField(rects) {
  const N = Gw * Gh, f1 = new Float32Array(N), sig = P.sigma, is1 = 1 / (sig * sig);
  for (const r of rects) {

    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      let dx = Math.abs(gx * STEP - r.cx) - chw, dy = Math.abs(gy * STEP - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;

function sampleArr(a, x, y) {

// Outline of the plates: marching squares over inside/outside values on a coarse grid; crossing points are always edge midpoints,

// Returns loops of [x0, y0, x1, y1, …] (CSS px)
function plateLoops(s) {

    if (code === 0 || code === 15) continue;

    const seg = (p, q) => link(E[p](), E[q]());

      case 1: case 14: seg(3, 2); break;
      case 2: case 13: seg(2, 1); break;
      case 3: case 12: seg(3, 1); break;

      case 6: case 9: seg(0, 2); break;

/* ======================================================================
   Scene geometry (CSS px; independent of the canvas resolution): plates, rivets, gear trains, pipes and their fittings
   ====================================================================== */
let icons = [];                                  // this screen's coordinates (share.js draws them); all monitors' icons, the others fall outside the screen
let iconsW = [];                                 // the same icons in desktop coordinates, set by buildGeometry

  const fits = (x, y, R, parent) => {
    if (x < 6 || y < 6 || x > W - 6 || y > H - 6) return false;
    if (sampleArr(s, x, y) < R + 18) return false;
    for (const rm of geo.rooms) if (x > rm.x0 - R && x < rm.x1 + R && (y + R > rm.floor - 150 || y - R < rm.beam + BEAM_H + 8)) return false;   // clear of the beam and of the working corners along the floor
    for (const g of geo.gears) if (g !== parent && Math.hypot(g.x - x, g.y - y) < g.R + R + 15) return false;
    return true;
  };

    if (g.x < VX - 20 || g.x > VX + W + 20 || g.y < VY - 20 || g.y > VY + H + 20) continue;
    const v = g.level + 0.16 * Math.sin(t * 0.7 * P.speed + g.ph) + 0.035 * Math.sin(t * 9 * P.speed + g.ph * 3);
    const a = Math.PI * 0.8 + Math.min(1, Math.max(0, v)) * Math.PI * 1.4;
    ctx.lineWidth = 1.6; ctx.strokeStyle = '#1a120c';
    ctx.beginPath(); ctx.moveTo(g.x - Math.cos(a) * 3, g.y - Math.sin(a) * 3); ctx.lineTo(g.x + Math.cos(a) * 11, g.y + Math.sin(a) * 11); ctx.stroke();
    ctx.fillStyle = '#7a5a1e'; ctx.beginPath(); ctx.arc(g.x, g.y, 2.2, 0, 6.29); ctx.fill();
  }
  const vis = (px, py, m) => px > VX - m && px < VX + W + m && py > VY - m && py < VY + H + m;
  for (const f of geoNew.fans) {                   // fans: four blades turning behind a grille
    if (!vis(f.x, f.y, 40)) continue;
    const a0 = t * f.sp * P.speed;
    ctx.fillStyle = '#8a8270';
    for (let i = 0; i < 4; i++) { const a = a0 + i * Math.PI / 2; ctx.beginPath(); ctx.ellipse(f.x + Math.cos(a) * f.r * 0.5, f.y + Math.sin(a) * f.r * 0.5, f.r * 0.5, f.r * 0.2, a, 0, 6.2832); ctx.fill(); }
    ctx.strokeStyle = '#2a2018'; ctx.lineWidth = 1; ctx.beginPath();
    for (let rr = f.r * 0.35; rr <= f.r; rr += f.r * 0.32) { ctx.moveTo(f.x + rr, f.y); ctx.arc(f.x, f.y, rr, 0, 6.2832); }
    ctx.moveTo(f.x - f.r, f.y); ctx.lineTo(f.x + f.r, f.y); ctx.moveTo(f.x, f.y - f.r); ctx.lineTo(f.x, f.y + f.r); ctx.stroke();
    ctx.fillStyle = '#5e5446'; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, 6.2832); ctx.fill();
  }
  const wallTime = new Date();                     // wall clocks show the time
  for (const c of geoNew.clocks) {
    if (!vis(c.x, c.y, 40)) continue;
    const hh = (wallTime.getHours() % 12 + wallTime.getMinutes() / 60) / 12 * 6.2832 - Math.PI / 2, mm = (wallTime.getMinutes() + wallTime.getSeconds() / 60) / 60 * 6.2832 - Math.PI / 2, sc = wallTime.getSeconds() / 60 * 6.2832 - Math.PI / 2;
    ctx.strokeStyle = '#1a120c'; ctx.lineCap = 'round';
    ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(hh) * c.r * 0.5, c.y + Math.sin(hh) * c.r * 0.5); ctx.stroke();
    ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(mm) * c.r * 0.8, c.y + Math.sin(mm) * c.r * 0.8); ctx.stroke();
    ctx.strokeStyle = '#a8442e'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(sc) * c.r * 0.85, c.y + Math.sin(sc) * c.r * 0.85); ctx.stroke();
    ctx.fillStyle = '#7a5a1e'; ctx.beginPath(); ctx.arc(c.x, c.y, 1.8, 0, 6.2832); ctx.fill();
  }
  for (const d of geoNew.drips) {                  // drops falling from the taps
    if (!vis(d.x, d.y, 80)) continue;
    const u = ((t + d.ph) % d.every) / d.every, fall = u < 0.55 ? 0 : (u - 0.55) / 0.45;
    const dy = fall * fall * d.len, r = u < 0.55 ? 1 + u * 2.4 : 2.2;
    ctx.fillStyle = 'rgba(190,210,215,0.85)'; ctx.beginPath(); ctx.ellipse(d.x, d.y + 1.5 + dy, r * 0.8, r, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(30,40,45,0.6)'; ctx.lineWidth = 0.6; ctx.stroke();
  }
  for (const sp of geoNew.sparrows) if (vis(sp.x, sp.y, 30)) drawSparrow(ctx, sp.x, sp.y, sp.dir, t, sp.ph);   // sparrows on the cables
  ctx.globalCompositeOperation = 'lighter';
  for (const l of geoNew.lights) {                 // little indicator lights blinking, the odd spark from a frayed cable
    if (!vis(l.x, l.y, 30)) continue;
    const on = Math.sin(t * l.rate * 3 + l.ph) > -0.2;
    if (on) { ctx.globalAlpha = (e < 1 ? k : 1) * 0.9; ctx.drawImage(BULB, l.x - 9, l.y - 9, 18, 18); ctx.fillStyle = l.col; ctx.beginPath(); ctx.arc(l.x, l.y, 2.2, 0, 6.2832); ctx.fill(); }
    if (l.spark && vis(l.spark[0], l.spark[1], 30)) {
      const slot = Math.floor(t / 2.7 + l.ph), age = t / 2.7 + l.ph - slot;
      if (hash2(slot, l.ph * 100 | 0, 271) < 0.35 && age < 0.08) {
        ctx.globalAlpha = 1; ctx.strokeStyle = '#ffe9a0'; ctx.lineWidth = 1.2; ctx.beginPath();
        for (let i = 0; i < 7; i++) { const a = hash2(slot, i, 272) * 6.283, r = 4 + 9 * hash2(slot, i, 273); ctx.moveTo(l.spark[0], l.spark[1]); ctx.lineTo(l.spark[0] + Math.cos(a) * r, l.spark[1] + Math.sin(a) * r); }
        ctx.stroke(); ctx.drawImage(BULB, l.spark[0] - 16, l.spark[1] - 16, 32, 32);
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = e < 1 ? k : 1;
  ctx.globalCompositeOperation = 'lighter';       // warm glow of the bulbs, flickering now and then like an old wire
  for (const cb of geoNew.cables) {
    if (!cb.bulb) continue;
    const bx = cb.mx, by = cb.my + cb.drop + 15;
    if (bx < VX - 90 || bx > VX + W + 90 || by < VY - 90 || by > VY + H + 90) continue;
    const fl = 0.85 + 0.1 * Math.sin(t * 3.1 + cb.ph) - (Math.sin(t * 0.7 + cb.ph * 3) > 0.985 ? 0.5 : 0), sz = 170 * fl;
    ctx.globalAlpha = (e < 1 ? k : 1) * 0.7 * fl; ctx.drawImage(BULB, bx - sz / 2, by - sz / 2, sz, sz);
  }
  for (const l of geoNew.lamps) {                  // the lamps hanging from the beam and over the doors
    if (l.x < VX - 90 || l.x > VX + W + 90 || l.y < VY - 90 || l.y > VY + H + 90) continue;
    const fl = 0.85 + 0.1 * Math.sin(t * 2.7 + l.ph) - (Math.sin(t * 0.6 + l.ph * 3) > 0.988 ? 0.5 : 0), sz = 170 * fl;
    ctx.globalAlpha = (e < 1 ? k : 1) * 0.7 * fl; ctx.drawImage(BULB, l.x - sz / 2, l.y - sz / 2, sz, sz);
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of puffs) {                         // steam: rises, swells and fades
    if (p.age <= 0) continue;
    const u = p.age / p.life, r = p.r * (1 + 3.2 * u);
    ctx.globalAlpha = 0.75 * (1 - u) * Math.min(1, u * 8);
    ctx.drawImage(p.dark ? SMOKE : PUFF, p.x - r, p.y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  if (airship) drawAirship(ctx, airship, false, t);
}

/* ======================================================================
   Hosted mode: the scene is driven from outside
   - Wallpaper mode (?wallpaper=1): the desktop host sends messages through WebView2
   - Preview mode (?preview=1): the settings window sends messages through the iframe's postMessage
   Messages: icons (real icon rectangles, physical pixels) / settings (parameters, partial update) / reset (restore defaults) / pause
   ====================================================================== */
let iconsSeen = false;
function reseed(v) {
  seed = v;
  if (iconsSeen) commit(true);
}
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);   // "Refresh" in the settings window: new machine (desktop and preview use the same seed)
  let geometry = false, redraw = false;
  for (const k in v) {
    const r = RANGES[k];
    if (!r || typeof v[k] !== 'number' || !Number.isFinite(v[k])) continue;
    const val = Math.min(r[1], Math.max(r[0], r[2] ? Math.round(v[k]) : v[k]));
    if (P[k] === val) continue;
    P[k] = val;
    if (GEOMETRY_KEYS.includes(k)) geometry = true;
    if (k === 'metal') redraw = true;              // the cached layers are kept per metal: nothing to rebuild
  }
  if (geometry && iconsSeen) rebuildSoon();
  else if (redraw && paused && iconsSeen) draw(performance.now());
}
function drawGhosts() {
  document.getElementById('ghosts').innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) document.body.classList.add('ghosts');
  let first = true;
  const settlePaused = () => { if (paused && iconsSeen) { morphT0 = -1e9; draw(performance.now()); } };
  const handle = m => {
    if (m.t === 'pause') { paused = PREVIEW ? false : m.v; settlePaused(); return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t === 'layout') { setLayout(m); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical pixels → CSS pixels
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    clearTimeout(rebuildT);
    commit(first);                                // first time: the machine fades in; afterwards: old and new scene cross-fade
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
// Opened directly in a browser: a sample desktop (for work on the theme); R = new machine
function startStandalone() {
  document.body.classList.add('ghosts');
  const cell = (c, r) => ({ x: GRID_X0 + c * CELL_W, y: GRID_Y0 + r * CELL_H, w: CELL_W, h: 92 });
  icons = [];
  for (let c = 0; c < 3; c++) for (let r = 0; r < Math.min(8, Math.floor((H - TASKBAR) / CELL_H)); r++) icons.push(cell(c, r));
  for (const [c, r] of [[7, 1], [8, 1], [8, 2], [13, 4], [14, 4], [19, 0], [19, 1]]) if (GRID_X0 + (c + 1) * CELL_W < W) icons.push(cell(c, r));
  drawGhosts();
  iconsSeen = true;
  commit(true);
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reseed((Math.random() * 1e6) | 0); });
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); if (iconsSeen) { commit(false); morphT0 = -1e9; } }, 100);
});

resize();
if (WALL || PREVIEW) startHostedMode(); else startStandalone();
requestAnimationFrame(frame);
</script>
<script src="share.js"></script>   <!-- Share image / share animation (sample icons, names as color blocks) -->
