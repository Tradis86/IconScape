<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconScape · School</title>
<!--
  IconScape · school theme (original; the desktop is a classroom blackboard seen straight on; Canvas 2D)
  Art direction: a well-used slate blackboard. Around every group of icons the board has just been wiped: a lighter cloud of chalk dust
  with the arcs of the felt eraser. Everywhere else the day's lessons are written in chalk: equations, geometry, fractions, a graph,
  the solar system, an atom, a plant, the water cycle, letters, music, solids, times tables, a treasure map, doodles; white chalk with
  coloured accents. Children's crayon drawings are held up by magnets; along the bottom of every monitor runs the chalk tray, with
  sticks of chalk and the felt eraser. Animated: on every monitor a lesson now and then writes itself, stroke by stroke, under a stick
  of chalk, stays a while and is wiped away by the eraser; a paper airplane glides across the whole desktop; chalk dust floats down
  - Wiped areas: the same icon field as the other themes (a sum of Gaussians around the icons, warped by noise), traced with marching
    squares; the chalk lessons are rubbed out softly where they reach into them
  - Chalk: strokes are densified and wobbled by noise along their length, and stroked with a grainy pattern of the chalk colour
  - Static drawing is cached at the screen's actual pixels; when the icons move the old and new board cross-fade
  - Everything lives in desktop coordinates; the airplane follows the shared clock, so the board continues across monitors
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2e4a3c; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* Preview mode (?preview=1, inside the settings window) and standalone mode: translucent blocks mark where the icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.ghosts #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(0,0,0,.35); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="ghosts"></div>

/* ======================================================================
   Frame
   ====================================================================== */

  icons = [];
  for (let c = 0; c < 2; c++) for (let r = 0; r < Math.min(7, Math.floor((H - TASKBAR) / CELL_H)); r++) icons.push(cell(c, r));
  for (const [c, r] of [[7, 1], [8, 1], [8, 2], [13, 4], [14, 4], [19, 0], [19, 1]]) if (GRID_X0 + (c + 1) * CELL_W < W) icons.push(cell(c, r));
  drawGhosts();
  iconsSeen = true;
  commit(true);
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reseed((Math.random() * 1e6) | 0); });
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); initMovers(); if (iconsSeen) { commit(false); morphT0 = -1e9; } }, 100);
});

resize();
initMovers();
if (WALL || PREVIEW) startHostedMode(); else startStandalone();
requestAnimationFrame(frame);
</script>
