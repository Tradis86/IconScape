<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconScape · London</title>
<!--
  IconScape · London theme (a white desk seen from above, a travel flat lay; Canvas 2D)
  Art direction: a white desk covered in light grey London doodles and graffiti tags (or light grey polka dots, or white marble) in soft
  morning light, or in the warm pool of a lamp in the evening, styled like a travel flat lay. Polaroids of London's landmarks lie on it,
  with handwritten captions and strips of washi tape;
  the photos are real photographs from Wikimedia Commons under free licences (authors, licences and sources in THIRD_PARTY_NOTICES.md),
  cropped square and given the warm, faded look of instant film. Around them, drawn objects: a Union flag of fabric with its wrinkles
  and its canvas header, a crown with jewels, pearls, velvet and ermine, a cup of tea with milk on its saucer, a bowler hat, a furled
  black umbrella with a wooden crook, a gold pocket watch on its chain, a leather notebook with a fountain pen, a folded city map with
  a pin, a postcard with stamp and postmark, loose stamps, theatre tickets, coins, round tortoiseshell sunglasses, shortbread on a
  paper doily, a sprig of eucalyptus, red roses and a string of bunting. Everything casts a soft shadow away from the light
  - Icons: every group of icons rests on a leather desk pad (green, navy or burgundy, stitched and gold-tooled) that frames it and keeps
    the white icon names readable; nothing else is placed on the pads
  - Static drawing (desk, objects, light) is cached at the screen's actual pixels; when the icons move old and new desk cross-fade
  - Every frame draws the steam over the tea, the watch's hands at the real time, a polaroid now and then developing, the shadows of
    leaves swaying in the patches of sunlight and clouds now and then veiling the sun (morning light), dust in the light
  - Everything lives in desktop coordinates and what moves follows the shared clock, so the desk continues across monitors
-->
<style>

  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.ghosts #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(70,90,120,.55); box-shadow: 3px 6px 8px rgba(0,0,0,.25); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(70,90,120,.45); }
</style>
</head>

}
function drawGhosts() {
  document.getElementById('ghosts').innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) document.body.classList.add('ghosts');
  let first = true;
  const settlePaused = () => { if (paused && iconsSeen) { morphT0 = -1e9; draw(performance.now()); } };
  const handle = m => {
    if (m.t === 'pause') { paused = PREVIEW ? false : m.v; settlePaused(); return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t === 'layout') { setLayout(m); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical pixels → CSS pixels
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    clearTimeout(rebuildT);
    commit(first);                                // first time: the objects fade in; afterwards: old and new desk cross-fade
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
// Opened directly in a browser: a sample desktop (for work on the theme); R = new scene
function startStandalone() {
  document.body.classList.add('ghosts');
  const cell = (c, r) => ({ x: GRID_X0 + c * CELL_W, y: GRID_Y0 + r * CELL_H, w: CELL_W, h: 92 });
  icons = [];
  for (let c = 0; c < 2; c++) for (let r = 0; r < Math.min(7, Math.floor((H - TASKBAR) / CELL_H)); r++) icons.push(cell(c, r));
  for (const [c, r] of [[7, 1], [8, 1], [8, 2], [13, 4], [14, 4], [19, 0], [19, 1]]) if (GRID_X0 + (c + 1) * CELL_W < W) icons.push(cell(c, r));
  drawGhosts();
  iconsSeen = true;
  commit(true);
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reseed((Math.random() * 1e6) | 0); });
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); initMovers(); if (iconsSeen) { commit(false); morphT0 = -1e9; } }, 100);
});

resize();
initMovers();
if (WALL || PREVIEW) startHostedMode(); else startStandalone();
requestAnimationFrame(frame);
</script>
